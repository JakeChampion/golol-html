name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref at a time, and supersede rather than queue - but only for pull
# requests. A branch that is pushed twice in a minute does not need both runs, and
# this workflow is twenty-two jobs, so the second one is not free: superseded runs sit
# in the queue ahead of the ones that matter and delay them. Pushes to main are
# exempt, because each of those is a distinct commit that has to be gated on its
# own and cancelling one would leave a commit nothing tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action below is pinned to a commit SHA, with the release it belongs to
# in a trailing comment. A tag is mutable: `@v5` is a promise from whoever can
# move it, and the SHA is the code that actually runs. The comment is what makes
# a bump readable, so move the two together and never one without the other.
jobs:
  # Host-independent checks, run once rather than repeated per platform.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false

      - name: gofmt
        run: |
          # Deliberately not `gofmt -l . | tee /dev/stderr | (! read)`: under
          # macOS's bash 3.2, `set -e` (which GitHub always passes) aborts that
          # pipeline even when it succeeds, so the step failed unconditionally
          # on macOS and printed nothing to explain itself.
          unformatted=$(gofmt -l . differential)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            gofmt -d . differential
            exit 1
          fi
          echo "all files are gofmt-clean"

      # The base commit is what the fragment check diffs against, and the
      # default checkout is one commit deep, so fetch just that one. Shallow by
      # sha rather than fetch-depth: 0, which would pull the whole history of a
      # repository that vendors a static archive per platform.
      - name: Changelog fragments
        run: |
          base=""
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            base="${{ github.event.pull_request.base.sha }}"
          fi
          if [ -n "$base" ]; then
            scripts/check-changelog.sh --base "$base"
          else
            scripts/check-changelog.sh
          fi

      # Prove the fragments still assemble, so a release fold is never the run
      # that discovers one of them is unreadable.
      - run: scripts/changelog.sh >/dev/null

      # One vet per module: ./... stops at a module boundary, so the root's
      # invocation covers neither of the others. scripts/check-modules.sh fails
      # if a module is added and not listed here.
      - run: go vet ./...
      - run: cd differential && go vet ./...
      - run: cd properties && go vet ./...

  # Every supported platform links its own archive and runs the suite. The
  # matrix mirrors native.yml's smoke job, so an archive is exercised the same
  # way before it lands and on every push afterwards.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin_arm64
          # darwin/amd64 runs through Rosetta on an arm64 runner: macos-13 sat
          # queued indefinitely and GitHub is retiring Intel macOS runners.
          - os: macos-14
            target: darwin_amd64
            rosetta: true
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: ubuntu-24.04
            target: linux_amd64_musl
            musl: true
          - os: ubuntu-24.04-arm
            target: linux_arm64_musl
            musl: true
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: ${{ !matrix.musl }}
        with:
          go-version: '1.25'
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key a
          # cache on and setup-go warns if asked to try.
          cache: false

      - name: Confirm the expected archive is present
        shell: bash
        run: |
          archive="internal/lib/${{ matrix.target }}/liblolhtml.a"
          if [ ! -f "$archive" ]; then
            echo "::error::$archive is missing. Vendored archives are built by" \
                 "the 'native' workflow; run it and merge the pull request it opens."
            exit 1
          fi
          ls -l "$archive"

      - name: Verify archive checksums
        shell: bash
        working-directory: internal/lib
        run: |
          # sha256sum on Linux, shasum on macOS; the file format is compatible.
          #
          # --ignore-missing is deliberately absent: every archive is committed
          # for every platform, so a missing one is a real failure and should
          # not be quietly skipped. CR stripping is belt-and-braces against a
          # CRLF checkout; .gitattributes should already prevent it, and
          # without both the check silently verifies nothing on Windows.
          tr -d '\r' < SHA256SUMS > checksums.txt
          if command -v sha256sum >/dev/null; then
            sha256sum --check checksums.txt
          else
            shasum -a 256 --check checksums.txt
          fi
          rm -f checksums.txt

      - name: Test
        if: ${{ !matrix.musl && !matrix.rosetta }}
        run: |
          go build ./...
          # ./... rather than . so that examples/ is executed and not merely
          # compiled. Anything added there runs on every row in this matrix, so
          # it must be fast and must not touch the network.
          go test -count=1 ./...
          go test -race -count=1 ./...

      - name: Test darwin/amd64 under Rosetta
        if: ${{ matrix.rosetta }}
        env:
          GOARCH: amd64
          CGO_ENABLED: '1'
          CC: clang -arch x86_64
        run: |
          go build ./...
          # No -race through an emulator; the arm64 entry already covers it.
          go test -count=1 ./...

      # Alpine is tested through docker rather than a container job: the
      # runner's own node binary is glibc-linked, so actions/checkout cannot
      # run inside an Alpine container.
      - name: Test under musl
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$PWD":/src -w /src golang:1.25-alpine sh -c '
            set -eux
            apk add --no-cache gcc musl-dev
            go build -tags musl ./...
            go test -tags musl -count=1 ./...
          '

      - name: Benchmarks compile and run
        if: ${{ !matrix.musl && !matrix.rosetta }}
        run: go test -run '^$' -bench . -benchtime 10x .

  # The guard's build constraint and the set of link files are two lists that
  # must agree, and nothing else notices when they drift. They did drift once,
  # and a Windows build failed with "undefined:
  # golol_html_has_no_prebuilt_library_for_this_GOOS_GOARCH" rather than
  # linking. This resolves constraints for every platform from one runner.
  platforms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false
      - run: scripts/check-platforms.sh
      - run: scripts/check-workflows.sh
      - run: scripts/check-modules.sh
      - run: scripts/check-pins.sh
      # Symbol drift is checked for all seven archives from here, because
      # llvm-nm reads every one of them. The struct-layout probe is not: it has
      # to run the code, so it covers this runner's archive only and says so.
      - run: scripts/check-abi.sh

  # AddressSanitizer is where a cgo binding's real bugs live: use-after-free
  # across the boundary, double frees, overruns. The tests check what the
  # rewriter says; ASan checks that saying it did not corrupt anything.
  #
  # The vendored archive is not itself instrumented, but lol-html uses the
  # default system allocator, so ASan's malloc interposition covers the Rust
  # heap as well as ours.
  #
  # Linux only: -asan is unsupported on darwin/arm64, and Windows has no
  # equivalent here. -msan is deliberately absent - it reports uninitialised
  # reads in uninstrumented code, which the prebuilt archive is entirely made
  # of, so it would be all false positives.
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false

      # This runs every seed corpus entry through ASan as well as every test:
      # a fuzz target with no -fuzz is an ordinary test over the inputs its
      # f.Add calls supply, and `go test -v` names them, twelve for FuzzRewrite
      # and thirty-six for FuzzOperations. That is what the fuzz step this job
      # used to end with claimed to be for, so the corpus is still covered here
      # and the step is gone.
      #
      # It is gone because the engine, not the corpus, is what -asan does not
      # survive. `go test -asan -fuzz` reports a global-buffer-overflow zero
      # bytes after internal/fuzz._counters - the fuzzing engine's own coverage
      # counters, a zero-sized global whose address the linker rewrites to the
      # counter section, so ASan poisons a redzone over the counters and every
      # execution trips it. That is go.dev/issue/72766, fixed in Go 1.25 by
      # excluding those two symbols from instrumentation, and it still fails
      # twelve times out of twelve under 1.24.7.
      #
      # The intermittent failure in #327 is the same shape one layer down: ASan
      # failing its own invariant, "sanitizer_allocator_secondary.h:297
      # IsAligned(p, page_size_)", with no finding reported, only on amd64, only
      # in the -fuzz step and never in this one, and passing on a re-run of the
      # same commit. allocator_may_return_null went in as an attempt at it and
      # comes out with the step: it governs what ASan does with an allocation it
      # declines to serve, and this is a check inside the allocator, so there
      # was no mechanism by which it would have helped. Eight sixty-second runs
      # on a 1.25.1 amd64 host did not reproduce the failure, so its own
      # mechanism is still unproven - what is proven is that this combination
      # has already been broken once at the toolchain level, in the engine's
      # memory rather than in ours.
      #
      # ASan over inputs the search found still happens, in the nightly fuzz
      # job, which fuzzes without the sanitizer and replays the corpus under it.
      - name: Tests and seed corpora under AddressSanitizer
        run: go test -asan -count=1 .

      # The step above is a fixed corpus: the tests, and the seeds their f.Add
      # calls supply. The generated documents are in properties/, a separate
      # module that ./... does not cross, so nothing had ever run a generated
      # workload under the sanitizer - the one kind of input most likely to
      # reach a path the fixed corpus does not. Fewer checks than the properties
      # job runs: ASan is expensive, and this is looking for corruption, not for
      # a counter-example that job would already have found.
      - name: Generated documents under AddressSanitizer
        working-directory: properties
        run: go test -asan -count=1 -rapid.checks=200 ./...

  # The README promises a minimum Go version, and a promise nothing checks
  # rots. This builds and tests against the oldest supported toolchain, so
  # reaching for a newer language or library feature fails here rather than in
  # a user's build.
  minimum-go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Must match the `go` directive in go.mod.
          go-version: '1.24'
          cache: false
      - run: go version
      - run: go build ./...
      - run: go test -count=1 ./...

  # Property tests: generated documents rather than a fixed corpus, with
  # shrinking so a counter-example arrives small enough to read. Its own module,
  # like differential/, so rapid never reaches a consumer's module graph.
  #
  # One row per archive a runner can link directly. Every platform links a
  # different prebuilt liblolhtml.a and this module used to run against exactly
  # one of the seven, so a defect reachable only from a generated document on a
  # non-amd64 archive had no job that could see it. Two rows of the platform
  # matrix are deliberately not here: darwin/amd64 under Rosetta, because
  # emulating this workload for an archive whose arm64 sibling is covered buys
  # little for the minutes, and the two musl rows, because they run inside a
  # docker container that would have to fetch and build this module's
  # dependencies to test a difference that is libc linkage. The root suite still
  # covers all seven.
  properties:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: macos-14
            target: darwin_arm64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: properties/go.sum
      - name: Property tests (${{ matrix.target }})
        working-directory: properties
        # bash everywhere: the default shell on the Windows runner is pwsh,
        # which reports only the exit status of a run block's last line, so the
        # first invocation below could fail without failing the step.
        shell: bash
        # More than the default 100 checks: these are cheap, and the
        # interesting counter-examples so far turned up in the hundreds.
        #
        # Under -race as well, like the root and differential. Measured at 1.5s
        # without and 7.9s with, for 2000 checks, which is worth it for code that
        # drives the library harder than any fixed corpus does.
        run: |
          go test -count=1 -rapid.checks=2000 ./...
          go test -race -count=1 -rapid.checks=2000 ./...

  # The differential tests live in their own module so the root stays
  # dependency-free, which also means `go test ./...` at the root never sees
  # them. They have to be run explicitly.
  #
  # Matrixed over the same four archives as properties, and left off the same
  # three rows, for the same reason: the comparison against x/net/html is only
  # as good as the archive it compares, and it used to see one of the seven.
  differential:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux_amd64
          - os: ubuntu-24.04-arm
            target: linux_arm64
          - os: macos-14
            target: darwin_arm64
          - os: windows-latest
            target: windows_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache-dependency-path: differential/go.sum
      - name: Compare against golang.org/x/net/html (${{ matrix.target }})
        working-directory: differential
        # bash everywhere, as in properties above.
        shell: bash
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false
      - name: Fuzz the rewriter briefly
        # A single package, not ./...: -fuzz refuses to run against more than
        # one package, and ./... also matches examples/rewrite-url.
        run: go test -run '^$' -fuzz FuzzRewrite -fuzztime 90s .

      # Two invocations rather than one, for the same reason: -fuzz takes one
      # target. FuzzOperations is the one that drives the cgo boundary and its
      # only coverage-guided time was the nightly schedule - which no pull
      # request waits for, and which GitHub disables after sixty days of
      # repository inactivity. Ninety seconds is a smoke test, as above, but it
      # is engine time on every pull request rather than none.
      - name: Fuzz the operation sequence briefly
        run: go test -run '^$' -fuzz FuzzOperations -fuzztime 90s .

  # A consumer must be able to depend on this module and build without Rust.
  consume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: golol-html
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false
      - name: Build a module that depends on this one
        run: |
          set -euxo pipefail
          mkdir consumer && cd consumer
          cat > go.mod <<'GOMOD'
          module consumer

          go 1.25

          require github.com/JakeChampion/golol-html v0.0.0
          replace github.com/JakeChampion/golol-html => ../golol-html
          GOMOD
          cat > main.go <<'MAIN'
          package main

          import (
          	"fmt"

          	lolhtml "github.com/JakeChampion/golol-html"
          )

          func main() {
          	out, err := lolhtml.RewriteString(`<a href="/x">l</a>`,
          		lolhtml.OnElement("a", func(e *lolhtml.Element) error {
          			return e.SetAttribute("rel", "noopener")
          		}))
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(out)
          }
          MAIN
          go mod tidy
          # Prove no Rust toolchain is consulted during a consumer build.
          env PATH="$(echo "$PATH" | tr ':' '\n' | grep -v cargo | paste -sd: -)" go run .
