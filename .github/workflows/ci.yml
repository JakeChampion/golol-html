name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Each runner exercises a different vendored archive, which is the part of
    # this module most likely to be wrong on a platform nobody built on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # darwin/arm64
            target: darwin_arm64
          - os: ubuntu-24.04  # linux/amd64
            target: linux_amd64
          - os: ubuntu-24.04-arm  # linux/arm64
            target: linux_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key a
          # cache on and setup-go warns if asked to try.
          cache: false

      - name: Confirm the expected archive is present
        run: |
          archive="internal/lib/${{ matrix.target }}/liblolhtml.a"
          if [ ! -f "$archive" ]; then
            echo "::error::$archive is missing. Vendored archives are built by" \
                 "the 'native' workflow; run it for ${{ matrix.target }} and" \
                 "merge the pull request it opens."
            exit 1
          fi
          ls -l "$archive"

      - name: Verify archive checksums
        working-directory: internal/lib
        run: |
          # sha256sum on Linux, shasum on macOS; the file format is compatible.
          if command -v sha256sum >/dev/null; then
            sha256sum --check --ignore-missing SHA256SUMS
          else
            shasum -a 256 --check --ignore-missing SHA256SUMS
          fi

      - name: gofmt
        run: |
          # Deliberately not `gofmt -l . | tee /dev/stderr | (! read)`: under
          # macOS's bash 3.2, `set -e` (which GitHub always passes) aborts that
          # pipeline even when it succeeds, so the step failed unconditionally
          # on macOS and printed nothing to explain itself.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
          echo "all files are gofmt-clean"

      - run: go vet ./...

      - run: go build ./...

      - run: go test -count=1 ./...

      - run: go test -race -count=1 ./...

      - name: Benchmarks compile and run
        run: go test -run '^$' -bench . -benchtime 10x ./...

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Fuzz the rewriter briefly
        # A single package, not ./...: -fuzz refuses to run against more than
        # one package, and ./... also matches examples/rewrite-url.
        run: go test -run '^$' -fuzz FuzzRewrite -fuzztime 90s .

  # A consumer must be able to depend on this module and build without Rust.
  consume:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          path: golol-html
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Build a module that depends on this one
        run: |
          set -euxo pipefail
          mkdir consumer && cd consumer
          cat > go.mod <<'GOMOD'
          module consumer

          go 1.25

          require github.com/JakeChampion/golol-html v0.0.0
          replace github.com/JakeChampion/golol-html => ../golol-html
          GOMOD
          cat > main.go <<'MAIN'
          package main

          import (
          	"fmt"

          	lolhtml "github.com/JakeChampion/golol-html"
          )

          func main() {
          	out, err := lolhtml.RewriteString(`<a href="/x">l</a>`,
          		lolhtml.OnElement("a", func(e *lolhtml.Element) error {
          			return e.SetAttribute("rel", "noopener")
          		}))
          	if err != nil {
          		panic(err)
          	}
          	fmt.Println(out)
          }
          MAIN
          go mod tidy
          # Prove no Rust toolchain is consulted during a consumer build.
          env PATH="$(echo "$PATH" | tr ':' '\n' | grep -v cargo | paste -sd: -)" go run .
