name: verify-native

# Rebuild a vendored archive from the pinned lol-html revision and diff it
# against the committed one.
#
# This is the only thing in the repository that ties the binaries under
# internal/lib to the revision they claim to come from. SHA256SUMS proves the
# files have not rotted, not where they came from - whoever can push the
# archives can push the sums with them - and scripts/check-pins.sh compares
# prose against prose. Without this, a pin bumped and tagged before the native
# rebuild landed would ship the old binaries under a new claimed revision with
# every other check green.
#
# It is a separate workflow rather than a job in ci.yml because it builds
# lol-html from source: minutes, not seconds. So it runs where it pays - from
# release.yml, at the commit about to be tagged, before the tag exists; on a
# tag pushed by hand; on a pull request that touches the pin, the archives or
# the changelog (the release pull request touches only the changelog); and
# weekly, to catch the runner image or a toolchain download drifting under a
# build that is supposed to be bit-for-bit. Not a moved upstream tag: the pin
# is a commit fetched by its hash, and a tag moving cannot change what is
# built.

on:
  # The release gate. release.yml calls this with the commit it is about to
  # tag, and does not tag unless it passes. It needs no token: a called
  # workflow runs as part of the caller's run.
  workflow_call:
    inputs:
      ref:
        description: 'Commit to verify (default: the ref this run is for)'
        type: string
        required: false
        default: ''
  push:
    tags: ['v*']
  pull_request:
    # CHANGELOG.md is here for the release pull request, whose only change is
    # the fold. Not a `branches: [release/next]` filter: branches and paths are
    # both applied, so that would still have needed a path the release branch
    # touches. The release pull request is the one merge that becomes a tag,
    # and this is the check that says whether the tag should exist.
    paths:
      - 'scripts/build-native.sh'
      - 'internal/**'
      - 'CHANGELOG.md'
      - '.github/workflows/verify-native.yml'
  schedule:
    # 04:23, off the hour for the reason fuzz.yml gives.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# When called from release.yml the github context is the caller's, so this
# group reads `release-refs/heads/main` there: distinct from release.yml's own
# `release` group, and never cancelled, because a push is not a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproduce:
    # ubuntu-24.04 specifically, matching native.yml's build job: the archives
    # were produced there, and a different image is a different toolchain.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit release.yml is about to tag, when called from there;
          # empty otherwise, which checkout treats as the event's own ref.
          ref: ${{ inputs.ref }}

      # rustc records the absolute path of the source tree and of CARGO_HOME in
      # panic metadata that survives stripping, so the same revision built with
      # the same compiler in a different directory hashes differently. That is
      # why `make verify` cannot succeed on a laptop, and why it can succeed
      # here: a runner's workspace is exactly the path the archives were built
      # at. If that ever stops being true the diff below would report a
      # mismatch that looks like tampering, so say so plainly instead.
      - name: Check this runner reproduces the build path
        run: |
          expected=/home/runner/work/golol-html/golol-html
          if [ "${GITHUB_WORKSPACE}" != "${expected}" ]; then
            echo "::error::workspace is ${GITHUB_WORKSPACE}, not ${expected}." \
                 "The archives embed the build path, so a rebuild here cannot" \
                 "match the committed one and this job cannot prove anything." \
                 "See docs/provenance.md."
            exit 1
          fi
          if [ "${CARGO_HOME:-$HOME/.cargo}" != "/home/runner/.cargo" ]; then
            echo "::error::CARGO_HOME is ${CARGO_HOME:-$HOME/.cargo}," \
                 "not /home/runner/.cargo. Same reason."
            exit 1
          fi
          echo "workspace and CARGO_HOME match the paths the archives were built at"

      - name: Read the pins
        id: pins
        run: scripts/build-native.sh --print-pins >> "$GITHUB_OUTPUT"

      - name: Install Rust
        run: |
          rustup toolchain install ${{ steps.pins.outputs.rust_toolchain }} --profile minimal
          rustup default ${{ steps.pins.outputs.rust_toolchain }}

      - name: Install llvm-strip
        # GNU binutils cannot read these archives at all: LTO leaves bitcode in
        # the members, and strip reports success having done nothing.
        #
        # llvm-18 by name, not the `llvm` meta-package: llvm-strip decides the
        # bytes of the archive, and the meta-package points at whatever LLVM
        # the distribution favours on the day. It has to match the version
        # native.yml stripped with, or the diff below fails for a reason the
        # script's own message would attribute to paths. The versioned package
        # installs no unversioned names, hence the PATH entry.
        run: |
          sudo apt-get update && sudo apt-get install -y llvm-18
          echo /usr/lib/llvm-18/bin >> "$GITHUB_PATH"

      - name: Rebuild the host archive and diff it
        # --verify restores the committed files on its way out, including on
        # failure, so a mismatch leaves the tree as it found it.
        run: scripts/build-native.sh --verify

      - name: Say what was proved
        run: |
          echo "### Archive reproduces from the pin" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`linux_amd64\` rebuilt byte-for-byte from lol-html \`${{ steps.pins.outputs.lol_html_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "with rustc \`${{ steps.pins.outputs.rust_toolchain }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The other six are cross-built from the same source in the same run of" >> "$GITHUB_STEP_SUMMARY"
          echo "\`native.yml\`; this job checks one of them. See \`docs/provenance.md\`." >> "$GITHUB_STEP_SUMMARY"
