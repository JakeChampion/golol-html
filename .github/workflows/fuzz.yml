name: fuzz

# The CI fuzz step runs for 90 seconds, which is a smoke test rather than a
# search. This runs for long enough to find something, and keeps the corpus
# between runs so each night starts where the last one finished.
on:
  schedule:
    # 03:17 rather than on the hour, to avoid the scheduling stampede.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to fuzz each target'
        required: false
        default: '15'

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `rate` is executions per minute, measured from nightly runs, and is
          # what converts the requested minutes into an execution count. See
          # the Fuzz step for why this is counted rather than timed.
          - target: FuzzRewrite
            asan: false
            rate: 1700000
          - target: FuzzOperations
            asan: false
            rate: 2000000
          # FuzzOperations is the one that drives the cgo boundary, so it is
          # also the one worth the cost of running under AddressSanitizer.
          # Roughly 12x slower: 2.6M executions a night against 31.8M without.
          - target: FuzzOperations
            asan: true
            rate: 170000
    runs-on: ubuntu-24.04
    # Counted rather than timed, so duration now depends on runner speed. This
    # bounds a pathologically slow runner instead of letting it burn six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Locate the fuzz corpus cache
        id: cache-dir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # Go keeps generated corpus entries in GOCACHE. Restoring them means the
      # search continues rather than restarting from the seeds every night.
      - name: Restore corpus
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: fuzz-${{ matrix.target }}-asan${{ matrix.asan }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-asan${{ matrix.asan }}-

      - name: Fuzz
        run: |
          minutes="${{ inputs.minutes || '15' }}"
          flags=""
          if [ "${{ matrix.asan }}" = "true" ]; then
            flags="-asan"
          fi

          # Counted, not timed. A duration gives the fuzzing coordinator a
          # deadline context; when it expires, workers are mid-RPC and the
          # cancellation surfaced as "--- FAIL: context deadline exceeded".
          # That was not occasional - it happened on every job on every one of
          # the first three scheduled nights, so every run ended in a failure
          # that had to be suppressed, which is no way to read a signal.
          #
          # `-fuzztime Nx` stops on an execution count and creates no deadline,
          # so there is no timer for shutdown to race. The count comes from
          # each target's measured throughput, so a night still takes about the
          # requested number of minutes.
          execs=$(( ${{ matrix.rate }} * minutes ))
          echo "fuzzing ${{ matrix.target }} for ${execs} executions (~${minutes}m)"

          set +e
          go test $flags -run '^$' -fuzz '^${{ matrix.target }}$' \
            -fuzztime "${execs}x" . 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] && exit 0

          # Go's fuzzing engine reports "context deadline exceeded" as a test
          # failure when a worker does not acknowledge the stop signal within
          # its grace period at the end of a timed run. Nothing has actually
          # failed, and it has now happened twice: once at 1600 execs/sec where
          # slow iterations were to blame, and once at 39k execs/sec where they
          # were not.
          #
          # The distinction from a real finding is exact rather than a guess: a
          # failing input is always written to testdata/fuzz/, so no crasher
          # plus that message means the shutdown raced. Anything else stays a
          # failure.
          # Retained as a safety net, but counted fuzzing should never hit it.
          # If this fires, the change above did not work and it needs looking
          # at rather than living behind a warning.
          if grep -q 'context deadline exceeded' fuzz.log && [ ! -d testdata/fuzz ]; then
            echo "::warning title=Unexpected shutdown race::${{ matrix.target }} hit a" \
                 "deadline despite counted fuzzing, with no failing input. This is not" \
                 "supposed to be reachable any more - investigate."
            exit 0
          fi

          echo "::error::${{ matrix.target }} failed with a real finding"
          exit "$rc"

      # A crasher is written to testdata/fuzz/<target>/, which is exactly the
      # form a committed regression seed takes - so upload it rather than
      # leaving it in a discarded runner.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: crasher-${{ matrix.target }}-asan${{ matrix.asan }}
          path: testdata/fuzz/
          if-no-files-found: ignore

      - name: Save corpus
        # Save even on failure: the corpus that found a bug is worth keeping.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: fuzz-${{ matrix.target }}-asan${{ matrix.asan }}-${{ github.run_id }}
