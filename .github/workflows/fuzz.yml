name: fuzz

# The CI fuzz step runs for 90 seconds, which is a smoke test rather than a
# search. This runs for long enough to find something, and keeps the corpus
# between runs so each night starts where the last one finished.
on:
  schedule:
    # 03:17 rather than on the hour, to avoid the scheduling stampede.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to fuzz each target'
        required: false
        default: '15'

permissions:
  contents: read

# Actions are pinned by commit SHA with the release in a trailing comment, for
# the reason given in ci.yml.
jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          # `rate` is executions per minute, measured from nightly runs, and is
          # what converts the requested minutes into an execution count. See
          # the Fuzz step for why this is counted rather than timed.
          #
          # It needs re-measuring when a target's per-execution work changes.
          # FuzzRewrite now records what each handler was told and compares the
          # two runs, which is work proportional to the number of structural
          # handler invocations; local timing could not resolve its cost against
          # run-to-run variance of about 40 per cent, so the figure below is
          # unchanged and the next night's log is what to read. timeout-minutes
          # bounds the damage if it turns out to be slower.
          - target: FuzzRewrite
            rate: 1700000
            # Replayed as well. This target crosses the cgo boundary on every
            # execution - fuzz_test.go calls it a crash check for the C
            # boundary - and its generated inputs never used to meet the
            # sanitizer at all: ci.yml's sanitize job covers its twelve
            # committed seeds, and nothing covered the millions of inputs a
            # night finds. A heap overrun that corrupts memory without crashing
            # would go unnoticed for any input only the search knows about.
            replay: true
          # FuzzOperations is the other one that drives the cgo boundary. ASan
          # over it used to be a third matrix row fuzzing under -asan at 170k
          # executions a minute against 2M without; it is now the replay step
          # below, which puts the same inputs under ASan without the engine.
          # See there for why the engine is what could not stay - what was
          # removed is the engine under the sanitizer, not the corpus, and
          # neither row may turn back into the former.
          - target: FuzzOperations
            rate: 2000000
            replay: true
    runs-on: ubuntu-24.04
    # Counted rather than timed, so duration now depends on runner speed. This
    # bounds a pathologically slow runner instead of letting it burn six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: false

      - name: Locate the fuzz corpus cache
        id: cache-dir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"

      # Go keeps generated corpus entries in GOCACHE. Restoring them means the
      # search continues rather than restarting from the seeds every night.
      - name: Restore corpus
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          # The prefix is the target alone. It still matches the keys written
          # while the sanitizer was a matrix dimension - fuzz-<target>-asanfalse-
          # and -asantrue- - so the corpora built up to here are restored rather
          # than abandoned, and the most recent of them wins.
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target }}-

      - name: Fuzz
        run: |
          minutes="${{ inputs.minutes || '15' }}"

          # Counted, not timed. A duration gives the fuzzing coordinator a
          # deadline context; when it expires, workers are mid-RPC and the
          # cancellation surfaced as "--- FAIL: context deadline exceeded".
          # That was not occasional - it happened on every job on every one of
          # the first three scheduled nights, so every run ended in a failure
          # that had to be suppressed, which is no way to read a signal.
          #
          # `-fuzztime Nx` stops on an execution count and creates no deadline,
          # so there is no timer for shutdown to race. The count comes from
          # each target's measured throughput, so a night still takes about the
          # requested number of minutes.
          execs=$(( ${{ matrix.rate }} * minutes ))
          echo "fuzzing ${{ matrix.target }} for ${execs} executions (~${minutes}m)"

          set +e
          go test -run '^$' -fuzz '^${{ matrix.target }}$' \
            -fuzztime "${execs}x" . 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] && exit 0

          # Go's fuzzing engine reports "context deadline exceeded" as a test
          # failure when a worker does not acknowledge the stop signal within
          # its grace period at the end of a timed run. Nothing has actually
          # failed, and it has now happened twice: once at 1600 execs/sec where
          # slow iterations were to blame, and once at 39k execs/sec where they
          # were not.
          #
          # The distinction from a real finding is exact rather than a guess: a
          # failing input is always written to testdata/fuzz/, so no crasher
          # plus that message means the shutdown raced. Anything else stays a
          # failure.
          # Retained as a safety net, but counted fuzzing should never hit it.
          # If this fires, the change above did not work and it needs looking
          # at rather than living behind a warning.
          if grep -q 'context deadline exceeded' fuzz.log && [ ! -d testdata/fuzz ]; then
            echo "::warning title=Unexpected shutdown race::${{ matrix.target }} hit a" \
                 "deadline despite counted fuzzing, with no failing input. This is not" \
                 "supposed to be reachable any more - investigate."
            exit 0
          fi

          echo "::error::${{ matrix.target }} failed with a real finding"
          exit "$rc"

      # A crasher is written to testdata/fuzz/<target>/, which is exactly the
      # form a committed regression seed takes - so upload it rather than
      # leaving it in a discarded runner.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: crasher-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
          # A finding is the whole point of the night, and nothing here can
          # commit it - this workflow is contents:read. Keep it for as long as
          # an artifact can be kept, so the window to turn it into a seed under
          # testdata/fuzz/ is months rather than the default fortnight.
          retention-days: 90

      # AddressSanitizer over every input the search found, with the search
      # itself never under it. `go test -asan -fuzz` is the combination that
      # produced go.dev/issue/72766 - a global-buffer-overflow reported zero
      # bytes after internal/fuzz._counters, the engine's own coverage counters,
      # which the linker moves and ASan then poisons a redzone across - and the
      # intermittent "sanitizer_allocator_secondary.h:297 IsAligned(p,
      # page_size_)" check failure in #327. Both are the engine's memory rather
      # than this library's, and neither is reachable from here: a fuzz target
      # run without -fuzz is an ordinary test over the files it is given.
      #
      # It buys the search back as well. Under -asan FuzzOperations managed 170k
      # executions a minute against 2M without, so the night now searches
      # roughly twelve times as far and ASan still sees everything the search
      # kept.
      #
      # A cache entry and a committed seed are the same file format, so copying
      # the corpus into testdata/fuzz/<target> is all "replay" means.
      - name: Replay the corpus under AddressSanitizer
        if: ${{ matrix.replay }}
        run: |
          corpus="${{ steps.cache-dir.outputs.dir }}/github.com/JakeChampion/golol-html/${{ matrix.target }}"
          n=0
          [ -d "$corpus" ] && n=$(find "$corpus" -type f | wc -l)
          if [ "$n" -eq 0 ]; then
            echo "::error::no corpus under $corpus. The step above fuzzed for" \
                 "millions of executions, so an empty corpus is not a quiet" \
                 "pass - it means this replay would have measured nothing."
            exit 1
          fi
          echo "replaying ${n} generated inputs, plus the seeds, under AddressSanitizer"

          mkdir -p "testdata/fuzz/${{ matrix.target }}"
          # cp -R of the directory's contents rather than a glob: a mature
          # corpus is thousands of files and a glob is an argument list.
          cp -R "$corpus/." "testdata/fuzz/${{ matrix.target }}/"

          set +e
          go test -asan -count=1 -run '^${{ matrix.target }}$' . 2>&1 | tee replay.log
          rc=${PIPESTATUS[0]}
          set -e
          [ "$rc" -eq 0 ] && exit 0

          # Keep only what failed. testdata now holds the whole corpus, and an
          # artifact of ten thousand inputs that passed hides the one that did
          # not. A failing seed has no file to keep; it is in the source.
          mkdir -p replay-crashers
          grep -oE "FAIL: ${{ matrix.target }}/[^ ]+" replay.log | sed 's|.*/||' |
            while read -r entry; do
              cp "testdata/fuzz/${{ matrix.target }}/${entry}" replay-crashers/ 2>/dev/null || true
            done
          echo "::error::${{ matrix.target }} failed replaying its corpus under AddressSanitizer"
          exit "$rc"

      - name: Upload the input that failed under AddressSanitizer
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: replay-crasher-${{ matrix.target }}
          path: replay-crashers/
          if-no-files-found: ignore
          retention-days: 90

      # The cache is a working copy, not storage. GitHub evicts entries unused
      # for seven days, LRU-evicts at the repository cap, and disables a cron
      # workflow after sixty days of repository inactivity - so a quiet month
      # discards everything the search has learned, silently, with nothing to
      # restore from. An artifact is a second copy somebody can download: to
      # re-seed the cache, or to commit entries into testdata/fuzz/<target>,
      # where a cache entry and a committed seed are the same file format.
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: corpus-${{ matrix.target }}
          path: ${{ steps.cache-dir.outputs.dir }}/github.com/JakeChampion/golol-html/${{ matrix.target }}
          # A corpus this step cannot find is worth saying out loud, but it is
          # not worth failing the night over: the replay step above already
          # fails on an empty corpus for the rows that replay.
          if-no-files-found: warn
          retention-days: 90

      - name: Save corpus
        # Save even on failure: the corpus that found a bug is worth keeping.
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
